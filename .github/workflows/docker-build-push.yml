name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Google Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: us-west2-docker.pkg.dev
        username: _json_key
        password: ${{ secrets.GCP_SA_KEY }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.strategy
        push: true
        tags: |
          us-west2-docker.pkg.dev/my-gcp-project/docker-registry/swag-bot:latest
          us-west2-docker.pkg.dev/my-gcp-project/docker-registry/swag-bot:${{ github.sha }}
    
    - name: Checkout helm charts repo
      uses: actions/checkout@v4
      with:
        repository: my-org/infra
        token: ${{ secrets.PAT_TOKEN }}
        path: helm-repo
    
    - name: Update image tag in helm charts
      run: |
        cd helm-repo
        sed -i '/^image:/,/^[^ ]/ s/tag: .*/tag: "${{ github.sha }}"/' ./infra/manifests/swag-bot/values.yaml
    
    - name: Commit and push changes
      run: |
        cd helm-repo
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "Update swag-bot image tag to ${{ github.sha }}"
        git push 
