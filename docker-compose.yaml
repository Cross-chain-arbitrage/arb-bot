version: '3.8'

services:
    fuse-fuse:
        build: &build-strategy
            context: .
            dockerfile: Dockerfile.strategy
        environment:
            - ENTRY_POINT=FusePoolsStrategy/FusePoolsStrategy.js
        env_file:
            - .env.docker.fuse-fuse
        container_name: fuse-fuse
        restart: unless-stopped

    story-weth:
        build: *build-strategy
        environment:
            - ENTRY_POINT=StoryWethPoolsStrategy/StoryWethPoolsStrategy.js
        env_file:
            - .env.docker.story-weth
        container_name: story-weth
        restart: unless-stopped

    lightlink-weth:
        build: *build-strategy
        environment:
            - ENTRY_POINT=LightlinkWethPoolsStrategy.js
        container_name: lightlink-weth
        env_file:
            - .env.docker.lightlink-weth
        restart: unless-stopped

    fuse-wbtc:
        build: *build-strategy
        environment:
            - ENTRY_POINT=FuseWbtcStrategy.js
        env_file:
            - .env.docker.fuse-wbtc
        container_name: fuse-wbtc
        restart: unless-stopped

    fuse-weth:
        build: *build-strategy
        environment:
            - ENTRY_POINT=FuseWethStrategy.js
        env_file:
            - .env.docker.fuse-weth
        container_name: fuse-weth
        restart: unless-stopped
